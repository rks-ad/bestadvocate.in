# Prefer Dokploy "Dockerfile" build type for production.
# Nixpacks injects ALL app env vars as Dockerfile ARG/ENV, which triggers
# SecretsUsedInArgOrEnv warnings for names containing KEY/SECRET (e.g. RESEND_API_KEY).
# RESEND_API_KEY is runtime-only for this app — do not mark it as a build-time variable in Dokploy.

[variables]
NIXPACKS_NODE_VERSION = "22"
# Prevent UndefinedVar warning on: ENV NIXPACKS_PATH=...:$NIXPACKS_PATH

[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
# Build does not need RESEND_API_KEY — keep that secret runtime-only in Dokploy.
cmds = ["npm run build"]

[start]
cmd = "npm run start"
